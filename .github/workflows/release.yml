name: Build & Release OTA APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tên phiên bản Release (vd: v2.3)'
        required: true
        default: 'v2.3'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine version tag and code
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VER_NAME="${TAG#v}"
          # versionCode tự động tăng theo số commit + 10 để luôn lớn hơn bản cũ
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VER_CODE=$((COMMIT_COUNT + 10))
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VER_CODE}" >> "$GITHUB_OUTPUT"
          echo "Building ${TAG} (versionName=${VER_NAME}, versionCode=${VER_CODE})"

      - name: Decode Release Keystore (if configured in Secrets)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ steps.ver.outputs.version_name }} \
            -PversionCode=${{ steps.ver.outputs.version_code }}
          cp app/build/outputs/apk/release/app-release.apk "GameScreenTranslator-${{ steps.ver.outputs.tag }}.apk"

      - name: Build Debug APK (Fallback when no Keystore Secret)
        if: steps.keystore.outputs.has_keystore != 'true'
        run: |
          ./gradlew assembleDebug \
            -PversionName=${{ steps.ver.outputs.version_name }} \
            -PversionCode=${{ steps.ver.outputs.version_code }}
          cp app/build/outputs/apk/debug/app-debug.apk "GameScreenTranslator-${{ steps.ver.outputs.tag }}.apk"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: GameScreenTranslator ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: GameScreenTranslator-${{ steps.ver.outputs.tag }}.apk
