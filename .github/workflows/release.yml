name: Build & Release OTA APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tên phiên bản Release (vd: v3.3)'
        required: true
        default: 'v3.3'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine version tag and code
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VER_NAME="${TAG#v}"
          VER_CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VER_CODE}" >> "$GITHUB_OUTPUT"
          echo "Building ${TAG} (versionName=${VER_NAME}, versionCode=${VER_CODE})"

      - name: Decode & Verify Release Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > app/release.jks
            FILE_SIZE=$(wc -c < app/release.jks)
            echo "Decoded app/release.jks size: ${FILE_SIZE} bytes"
            if [ "$FILE_SIZE" -lt 500 ]; then
              echo "::error::KEYSTORE_BASE64 không hợp lệ (file giải mã chỉ có ${FILE_SIZE} bytes, file .jks chuẩn phải > 2000 bytes). Hãy copy lại Base64 từ C:\AndroidProjects\release.jks!"
              exit 1
            fi
            CLEAN_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n' | xargs)
            CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n' | xargs)
            if ! KT_OUT=$(keytool -list -keystore app/release.jks -storepass "$CLEAN_PASS" -alias "$CLEAN_ALIAS" 2>&1); then
              echo "$KT_OUT"
              ONE_LINE=$(printf '%s' "$KT_OUT" | tr '\n' ' ')
              echo "::error::Keytool verify failed (size=${FILE_SIZE}B): ${ONE_LINE}"
              exit 1
            fi
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "sign_note=Signed Release (OTA cài đè giữ nguyên dữ liệu)" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "sign_note=Debug APK (Chưa cấu hình KEYSTORE_BASE64 - sẽ không cài đè OTA được)" >> "$GITHUB_OUTPUT"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease \
            -PversionName=${{ steps.ver.outputs.version_name }} \
            -PversionCode=${{ steps.ver.outputs.version_code }} \
            --stacktrace 2>&1 | tee gradle_release.log || {
              ERR_LINE=$(grep -E "^e:|FAILURE:|Caused by:|Execution failed" gradle_release.log | tail -n 5 | tr '\n' ' ')
              echo "::error::Gradle assembleRelease failed: ${ERR_LINE}"
              exit 1
            }
          cp app/build/outputs/apk/release/app-release.apk "GameScreenTranslator-${{ steps.ver.outputs.tag }}.apk"

      - name: Build Debug APK (Fallback when no Keystore Secret)
        if: steps.keystore.outputs.has_keystore != 'true'
        run: |
          ./gradlew assembleDebug \
            -PversionName=${{ steps.ver.outputs.version_name }} \
            -PversionCode=${{ steps.ver.outputs.version_code }}
          cp app/build/outputs/apk/debug/app-debug.apk "GameScreenTranslator-${{ steps.ver.outputs.tag }}.apk"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: GameScreenTranslator ${{ steps.ver.outputs.tag }}
          body: |
            - **Trạng thái chữ ký**: ${{ steps.keystore.outputs.sign_note }}
            - **Version Code**: `${{ steps.ver.outputs.version_code }}`
          generate_release_notes: true
          files: GameScreenTranslator-${{ steps.ver.outputs.tag }}.apk
